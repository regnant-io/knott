# KNOTT — run it with one command.
#
#   docker compose up --build
#   open http://localhost:8002
#
# KNOTT is a single process: the registry, execution engine, task service and
# agent registry all run inside it and talk over loopback, so there is nothing to
# wire together here. The optional Ollama service below gives you local AI
# decisions with no data leaving the machine.

services:
  knott:
    build:
      context: .
      dockerfile: build/docker/Dockerfile
      args:
        VERSION: ${KNOTT_VERSION:-dev}
    image: regnant/knott:${KNOTT_VERSION:-latest}
    container_name: knott
    restart: unless-stopped
    ports:
      - "${KNOTT_PORT:-8002}:8002"
    volumes:
      - knott-data:/var/lib/knott
    environment:
      # Set at least one key before exposing this beyond your machine.
      # Format: key:role — roles are admin, operator, viewer.
      API_KEYS: ${API_KEYS:-}
      # Require an HMAC signature on inbound webhooks.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Encrypts stored credentials. Generated and persisted on first run when
      # unset; set it explicitly to survive a volume rebuild.
      KNOTT_SECRET_KEY: ${KNOTT_SECRET_KEY:-}
      # AI provider — leave both unset for the built-in rule-based decisions.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      # Restrict browser origins in production.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Local AI decisions, nothing leaving the machine.
  # Start with:  docker compose --profile local-ai up
  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    container_name: knott-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  knott-data:
  ollama-models:
