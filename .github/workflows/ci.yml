name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          (cd desktop && go mod tidy)
          git diff --exit-code go.mod go.sum desktop/go.mod desktop/go.sum

      - run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build every command
        run: go build ./...

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/designer/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: apps/designer

      - run: npm test
        working-directory: apps/designer

      - run: npm run build
        working-directory: apps/designer

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/designer/package-lock.json

      - name: Audit the server module
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # The desktop module links WebKitGTK through cgo, so its packages only
      # type-check with the headers installed.
      - name: Audit the desktop module
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev >/dev/null
          cd desktop
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags desktop,production,webkit2_41 ./...

      - name: Audit console dependencies
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=moderate
        working-directory: apps/designer

  # The binary people download is built on one platform and must run on six.
  # Compiling for all of them on every change catches a platform-specific break
  # at the pull request rather than at release time.
  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /dev/null ./cmd/knott

  # The native desktop app links each platform's own web view, so it is built
  # on each platform.
  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev >/dev/null

      - name: Vet and build
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) TAGS=desktop,production;            LD="-H windowsgui"; export CGO_ENABLED=0 ;;
            macOS)   TAGS=desktop,production;            LD="";              export CGO_ENABLED=1 ;;
            Linux)   TAGS=desktop,production,webkit2_41; LD="";              export CGO_ENABLED=1 ;;
          esac
          go vet -tags "$TAGS" ./...
          go build -tags "$TAGS" -ldflags "-s -w $LD" -o "$RUNNER_TEMP/knott-desktop" .

  # A binary built from a fresh clone must serve the console and answer the API.
  # Unit tests do not cover the wiring between the four in-process services.
  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: { go-version: '1.26.8', cache: true }
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/designer/package-lock.json

      - name: Build console and binary
        run: |
          npm --prefix apps/designer ci --no-audit --no-fund
          npm --prefix apps/designer run build
          make embed
          go build -o knott ./cmd/knott

      - name: Start KNOTT
        run: |
          KNOTT_HOME="$RUNNER_TEMP/knott" ./knott serve --port 8799 --quiet &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8799/api/v1/health >/dev/null 2>&1 && break
            sleep 0.5
          done

      - name: Exercise the API and console
        run: |
          set -euo pipefail
          echo "· health"
          curl -fsS http://127.0.0.1:8799/api/v1/health | grep -q '"status":"ok"'
          echo "· console is served"
          curl -fsS http://127.0.0.1:8799/ | grep -qi '<div id="root">'
          echo "· single-port proxy reaches the registry, tasks and agents"
          curl -fsS http://127.0.0.1:8799/api/v1/workflows | grep -q '"data"'
          curl -fsS http://127.0.0.1:8799/api/v1/tasks     | grep -q '"data"'
          curl -fsS http://127.0.0.1:8799/api/v1/agents    | grep -q '"data"'
          echo "· connectors report their credentials and actions"
          curl -fsS http://127.0.0.1:8799/api/v1/connectors | grep -q '"credentials"'
          curl -fsS http://127.0.0.1:8799/api/v1/connectors | grep -q '"actions"'
          echo "· the embedded AI engine answers without Python"
          curl -fsS http://127.0.0.1:8799/internal/v1/config | grep -q '"active_provider"'
          curl -fsS -X POST http://127.0.0.1:8799/internal/v1/generate-workflow \
               -H 'Content-Type: application/json' -d '{"prompt":"approve invoices"}' | grep -q '"workflow"'
          echo "· a page on another origin cannot drive the API"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' \
                 -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8799/api/v1/workflows)
          [ "$code" = "403" ] || { echo "expected 403, got $code"; exit 1; }
          echo "· a seeded workflow runs to completion"
          curl -fsS -X POST http://127.0.0.1:8799/api/v1/examples/seed >/dev/null
          WF=$(curl -fsS http://127.0.0.1:8799/api/v1/workflows \
               | python3 -c 'import sys,json; print(json.load(sys.stdin)["data"][0]["id"])')
          RUN=$(curl -fsS -X POST http://127.0.0.1:8799/api/v1/runs \
                  -H 'Content-Type: application/json' \
                  -d "{\"workflow_id\":\"$WF\",\"input_data\":{\"amount\":10}}" \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS "http://127.0.0.1:8799/api/v1/runs/$RUN" \
                     | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            echo "  run status: $STATUS"
            case "$STATUS" in COMPLETED|WAITING_HUMAN) exit 0 ;; FAILED) exit 1 ;; esac
            sleep 1
          done
          echo "run did not reach a settled state"; exit 1

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          push: false
          load: true
          tags: knott:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and answers
        run: |
          docker run -d --name knott-ci -p 8002:8002 knott:ci
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8002/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8002/api/v1/health | grep -q '"status":"ok"'
          docker rm -f knott-ci
