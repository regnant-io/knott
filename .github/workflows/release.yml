name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.9.0)'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  # The console is built once and handed to every platform build, so all six
  # binaries carry byte-identical assets.
  console:
    name: Build console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/designer/package-lock.json
      - run: npm --prefix apps/designer ci --no-audit --no-fund
      - run: npm --prefix apps/designer run build
      - uses: actions/upload-artifact@v4
        with:
          name: console
          path: apps/designer/dist
          retention-days: 1

  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: console
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: true }

      - uses: actions/download-artifact@v4
        with: { name: console, path: apps/designer/dist }

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          make embed
          NAME="knott_${VERSION}_${GOOS}_${GOARCH}"
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p "dist/$NAME/ai-decision-engine"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/$NAME/knott$EXT" ./cmd/knott
          cp LICENSE NOTICE README.md "dist/$NAME/"
          cp services/ai-decision-engine/main.py "dist/$NAME/ai-decision-engine/"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -qr "$NAME.zip" "$NAME")
          else
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          fi

      - name: Linux packages
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          mkdir -p dist/pkgroot
          cp "dist/knott_${VERSION}_linux_${GOARCH}/knott" dist/pkgroot/knott
          VERSION="${VERSION#v}" GOARCH="$GOARCH" nfpm package -f build/nfpm.yaml -p deb -t dist/
          VERSION="${VERSION#v}" GOARCH="$GOARCH" nfpm package -f build/nfpm.yaml -p rpm -t dist/
          rm -rf dist/pkgroot

      - name: AppImage
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          # AppImages need FUSE; extracting sidesteps it on a runner.
          APPIMAGE_EXTRACT_AND_RUN=1 bash build/linux/make-appimage.sh "$VERSION" x86_64 || \
            echo "AppImage step failed — continuing without it"

      - name: Prune intermediate directories
        run: rm -rf dist/knott_*_*/ dist/KNOTT.AppDir

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 5

  macos-app:
    name: macOS app bundle
    needs: binaries
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-darwin-${{ matrix.goarch }}
          path: dist
      - name: Unpack and assemble KNOTT.app
        run: |
          set -euo pipefail
          tar -C dist -xzf "dist/knott_${VERSION}_darwin_${{ matrix.goarch }}.tar.gz"
          bash build/macos/make-app.sh "$VERSION" "${{ matrix.goarch }}"
          rm -rf dist/knott_*_darwin_*/ dist/KNOTT.app
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-app-${{ matrix.goarch }}
          path: dist/*.dmg
          retention-days: 5

  windows-installer:
    name: Windows installer
    needs: binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows-amd64
          path: dist
      - name: Build the MSI
        shell: bash
        run: |
          set -euo pipefail
          cd dist && unzip -q "knott_${VERSION}_windows_amd64.zip" && cd ..
          # WiX v3 ships with the windows-latest image.
          WIX="/c/Program Files (x86)/WiX Toolset v3.14/bin"
          [ -d "$WIX" ] || WIX="/c/Program Files (x86)/WiX Toolset v3.11/bin"
          # The RTF licence WixUI wants; generated rather than committed.
          printf '{\\rtf1\\ansi\\deff0 {\\fonttbl{\\f0 Segoe UI;}}\\fs18 ' > build/windows/license.rtf
          sed 's/[\\{}]/\\&/g; s/$/\\par /' LICENSE >> build/windows/license.rtf
          printf '}' >> build/windows/license.rtf
          "$WIX/candle.exe" -arch x64 \
            -dVersion="${VERSION#v}" \
            -dSourceDir="dist\\knott_${VERSION}_windows_amd64" \
            -out knott.wixobj build/windows/knott.wxs
          "$WIX/light.exe" -ext WixUIExtension -ext WixUtilExtension \
            -out "dist/KNOTT-${VERSION#v}-x64.msi" knott.wixobj
          rm -rf "dist/knott_${VERSION}_windows_amd64"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-installer
          path: dist/*.msi
          retention-days: 5

  publish:
    name: Publish release
    needs: [binaries, macos-app, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: staging
          merge-multiple: true

      - name: Checksum everything
        run: |
          cd staging
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: staging/*
          generate_release_notes: true
          draft: true
          body: |
            ## Install

            **macOS** — download the `.dmg`, drag KNOTT to Applications.
            **Windows** — download the `.msi`.
            **Linux** — `.deb`, `.rpm`, or the `.AppImage` to run without installing.
            **Docker** — `docker run -p 8002:8002 -v knott-data:/var/lib/knott ghcr.io/regnant/knott`
            **Anything else** — grab the archive for your platform; it holds one binary.

            Then run `knott desktop`, or `knott serve` and open http://localhost:8002.

            Verify a download against `SHA256SUMS`.

            > Set `API_KEYS` before binding KNOTT to anything but loopback.
            > See [SECURITY.md](https://github.com/regnant/knott/blob/main/SECURITY.md).

  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
