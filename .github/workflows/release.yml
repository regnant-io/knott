name: Release

# Builds every distribution of KNOTT and attaches them to a draft GitHub
# release:
#
#   Windows  configurable installer (.exe, x64 and ARM64) and a portable .zip
#   macOS    KNOTT.app in a drag-to-install .dmg (Apple silicon and Intel)
#   Linux    knott (server) and knott-desktop packages (.deb, .rpm; x64, ARM64)
#   Any      the knott command-line server as an archive for six platforms
#   Docker   ghcr.io image (on tag pushes)
#
# The desktop app links each OS's own web view, so it is built on each OS.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v1.2.0)'
        required: true
      publish:
        description: 'Attach the builds to a draft GitHub release (off = build and keep them as run artifacts only)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  GO_VERSION: '1.26.8'
  NFPM: github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
  WINRES: github.com/tc-hib/go-winres@v0.3.3

jobs:
  # The console is built once and handed to every build, so all artifacts carry
  # byte-identical assets.
  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/designer/package-lock.json
      - run: npm --prefix apps/designer ci --no-audit --no-fund
      - run: npm --prefix apps/designer test
      - run: npm --prefix apps/designer run build
      - uses: actions/upload-artifact@v7
        with:
          name: console
          path: apps/designer/dist
          retention-days: 1

  # ── The server / command-line binary ───────────────────────────────────────
  cli:
    name: CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: console
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '${{ env.GO_VERSION }}', cache: true }
      - uses: actions/download-artifact@v8
        with: { name: console, path: apps/designer/dist }

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          make embed
          NAME="knott_${VERSION}_${GOOS}_${GOARCH}"
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p "dist/$NAME"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/$NAME/knott$EXT" ./cmd/knott
          cp LICENSE NOTICE README.md "dist/$NAME/"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -qr "$NAME.zip" "$NAME")
          else
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          fi

      - name: Linux server packages
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go install "$NFPM"
          mkdir -p dist/pkgroot
          cp "dist/knott_${VERSION}_linux_${GOARCH}/knott" dist/pkgroot/knott
          VERSION="${VERSION#v}" GOARCH="$GOARCH" nfpm package -f build/nfpm.yaml -p deb -t dist/
          VERSION="${VERSION#v}" GOARCH="$GOARCH" nfpm package -f build/nfpm.yaml -p rpm -t dist/

      - name: Keep only the deliverables
        run: rm -rf dist/knott_*_*/ dist/pkgroot

      - uses: actions/upload-artifact@v7
        with:
          name: dist-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 5

  # ── Windows desktop app + installer ────────────────────────────────────────
  windows:
    name: Windows ${{ matrix.arch }}
    needs: console
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, label: x64 }
          - { arch: arm64, label: arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/download-artifact@v8
        with: { name: console, path: apps/designer/dist }

      - name: Build the app and the CLI
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          rm -rf internal/ui/dist/assets internal/ui/dist/index.html internal/ui/dist/favicon.svg
          cp -R apps/designer/dist/. internal/ui/dist/
          SHORT="${VERSION#v}"; NUM="${SHORT%%-*}.0"
          LDF="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7}"
          OUT="$GITHUB_WORKSPACE/dist/win"
          mkdir -p "$OUT/bin"
          # go-winres runs on the build machine, whatever GOARCH the app targets.
          (cd desktop && GOARCH= go run "$WINRES" make --in winres/winres.json --out rsrc --arch "$GOARCH" \
              --product-version "$NUM" --file-version "$NUM")
          (cd desktop && go build -trimpath -tags desktop,production -ldflags "$LDF -H windowsgui" -o "$OUT/KNOTT.exe" .)
          go build -trimpath -ldflags "$LDF -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "$OUT/knott.exe" ./cmd/knott
          cp "$OUT/knott.exe" "$OUT/bin/knott.exe"
          cp LICENSE NOTICE README.md "$OUT/"

      - name: Fetch the WebView2 bootstrapper
        run: curl -fsSL -o build/windows/MicrosoftEdgeWebview2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"

      - name: Build the installer
        run: |
          set -euo pipefail
          MAKENSIS="$(command -v makensis || true)"
          if [ -z "$MAKENSIS" ]; then
            for c in "/c/Program Files (x86)/NSIS/makensis.exe" "/c/Program Files/NSIS/makensis.exe"; do
              [ -x "$c" ] && MAKENSIS="$c" && break
            done
          fi
          if [ -z "$MAKENSIS" ]; then
            choco install nsis -y --no-progress >/dev/null
            MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          fi
          SHORT="${VERSION#v}"
          SRC="$(cygpath -w "$GITHUB_WORKSPACE/dist/win")"
          OUTFILE="$(cygpath -w "$GITHUB_WORKSPACE/dist")\\KNOTT-${SHORT}-windows-${{ matrix.label }}-setup.exe"
          "$MAKENSIS" -V3 -DVERSION="${SHORT%%-*}" -DARCH=${{ matrix.label }} -DSOURCE="$SRC" -DOUTFILE="$OUTFILE" build/windows/installer.nsi

      - name: Portable zip
        run: |
          set -euo pipefail
          SHORT="${VERSION#v}"
          P="dist/KNOTT-${SHORT}-windows-${{ matrix.label }}-portable"
          mkdir -p "$P/bin" "$P/data"
          cp dist/win/KNOTT.exe "$P/"
          cp dist/win/knott.exe "$P/bin/"
          cp LICENSE NOTICE README.md "$P/"
          # A data folder next to the app keeps everything inside this folder.
          echo "KNOTT keeps its workflows, runs and credentials here because this copy is portable." > "$P/data/README.txt"
          (cd dist && 7z a -tzip -bso0 "$(basename "$P").zip" "$(basename "$P")")
          rm -rf "$P" dist/win

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*
          retention-days: 5

  # ── macOS app bundle + disk image ──────────────────────────────────────────
  macos:
    name: macOS ${{ matrix.arch }}
    needs: console
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, clang: arm64 }
          - { arch: amd64, clang: x86_64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/download-artifact@v8
        with: { name: console, path: apps/designer/dist }

      - name: Build and package
        env:
          GOARCH: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          set -euo pipefail
          make embed
          LDF="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7}"
          # The runner is Apple silicon; clang cross-compiles the Intel build.
          (cd desktop && CGO_ENABLED=1 CC="clang -arch ${{ matrix.clang }}" \
             go build -trimpath -tags desktop,production -ldflags "$LDF" -o "$RUNNER_TEMP/KNOTT" .)
          CGO_ENABLED=0 go build -trimpath -ldflags "$LDF -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "$RUNNER_TEMP/knott" ./cmd/knott
          bash build/macos/make-app.sh "$VERSION" "$RUNNER_TEMP/KNOTT" "$RUNNER_TEMP/knott" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 5

  # ── Linux desktop packages ─────────────────────────────────────────────────
  linux-desktop:
    name: Linux desktop ${{ matrix.arch }}
    needs: console
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/download-artifact@v8
        with: { name: console, path: apps/designer/dist }

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev >/dev/null

      - name: Build and package
        run: |
          set -euo pipefail
          make embed
          mkdir -p dist/pkgroot
          (cd desktop && CGO_ENABLED=1 go build -trimpath -tags desktop,production,webkit2_41 \
             -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7}" -o ../dist/pkgroot/knott-desktop .)
          go install "$NFPM"
          VERSION="${VERSION#v}" GOARCH="${{ matrix.arch }}" nfpm package -f build/nfpm-desktop.yaml -p deb -t dist/
          VERSION="${VERSION#v}" GOARCH="${{ matrix.arch }}" nfpm package -f build/nfpm-desktop.yaml -p rpm -t dist/
          tar -C dist/pkgroot -czf "dist/knott-desktop_${VERSION}_linux_${{ matrix.arch }}.tar.gz" knott-desktop
          rm -rf dist/pkgroot

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-desktop-${{ matrix.arch }}
          path: dist/*
          retention-days: 5

  publish:
    name: Publish release
    needs: [cli, windows, macos, linux-desktop]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: staging
          merge-multiple: true

      - name: Checksum everything
        run: |
          cd staging
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: KNOTT ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: staging/*
          generate_release_notes: true
          draft: true
          body: |
            ## Install

            | | |
            |---|---|
            | **Windows** | `KNOTT-…-windows-x64-setup.exe` (or `arm64`). Choose per-user or all users, the folder, shortcuts, the `knott` command and start-at-sign-in. Silent: `/S /CURRENTUSER` or `/S /ALLUSERS`. A `-portable.zip` runs without installing. |
            | **macOS** | `KNOTT-…-macos-arm64.dmg` (Apple silicon) or `-amd64` (Intel). Drag KNOTT to Applications. The build is not notarised yet: the first time, right-click KNOTT → Open. |
            | **Linux** | `knott-desktop_…deb` / `.rpm` for the app (needs WebKitGTK 4.1), plus `knott_…deb` / `.rpm`, which it depends on. Servers only need `knott`. |
            | **Server** | `knott_…_<os>_<arch>` archives: one binary, `knott serve`. |
            | **Docker** | `docker run -p 8002:8002 -v knott-data:/var/lib/knott ghcr.io/${{ github.repository }}` |

            Local AI: install [Ollama](https://ollama.com) and pull any model — KNOTT finds it automatically.

            Verify downloads against `SHA256SUMS`.

            > Set `API_KEYS` before exposing KNOTT beyond this machine. See [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md).

  image:
    name: Container image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
