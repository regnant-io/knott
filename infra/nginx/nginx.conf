worker_processes auto;
events { worker_connections 1024; }

# ─── KNOTT — reverse proxy ───────────────────────────────────────────────────
#
# One trust boundary: everything goes to KNOTT on :8002, which enforces API-key
# auth and roles. The all-in-one binary keeps its internal services on loopback
# ports it chooses at startup, so there is nothing else to expose.
#
# Running the services separately? Bind each of them to 127.0.0.1 and route only
# through the engine. Pointing /api/v1/workflows straight at the registry would
# bypass authentication entirely — that is the mistake this file exists to avoid.
#
# The long read timeout matters: an AI decision against a local model can take
# well over a minute, and a proxy that gives up first turns a slow decision into
# a failed run.

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;

    # Reasonable upload cap for webhook payloads / workflow definitions.
    client_max_body_size 4m;

    upstream knott_engine { server 127.0.0.1:8002; }

    # ── HTTP : redirect to HTTPS (enable once TLS is configured) ──────────────
    server {
        listen 80;
        server_name _;

        # For a quick non-TLS start, comment the redirect and uncomment the
        # `location /` proxy block below.
        return 301 https://$host$request_uri;

        # location / { proxy_pass http://knott_engine; }
    }

    # ── HTTPS : the only public surface ───────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # Replace with your real certificate paths.
        ssl_certificate     /etc/nginx/certs/knott.crt;
        ssl_certificate_key /etc/nginx/certs/knott.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Everything (SPA, /api/v1, /internal/v1, webhooks) flows through the engine.
        location / {
            proxy_pass http://knott_engine;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 180s;
        }
    }
}
